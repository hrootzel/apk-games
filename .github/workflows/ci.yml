name: Container CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Docker test + Android gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check dependency lockfile
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo "::warning::package-lock.json is missing. npm resolution is not fully reproducible without the committed lockfile. Commit the lockfile from a clean WSL npm install."
          fi

      - name: Prepare Compose image tag and writable outputs
        id: compose
        run: |
          docker compose config --format json | python3 -c 'import json, sys; print("image=" + json.load(sys.stdin)["services"]["test"]["image"])' >> "$GITHUB_OUTPUT"
          mkdir -p out .cache/gradle
          chmod 0777 out .cache/gradle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and load the CI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.compose.outputs.image }}
          cache-from: type=gha,scope=vector-arcade
          cache-to: type=gha,mode=max,scope=vector-arcade

      - name: Run complete container test gate
        id: tests
        run: docker compose run --rm --pull never test

      - name: Assemble Android debug APK
        id: android
        run: docker compose run --rm --pull never apk bash ./scripts/assemble-android.sh

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vector-arcade-debug-${{ github.run_attempt }}
          path: out/vector-arcade-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-reports-${{ github.run_attempt }}
          path: |
            out/playwright-report/
            out/test-results/
            out/test-artifacts/coverage/
            out/android-reports/
            out/controls-*.png
          if-no-files-found: ignore
          retention-days: 1
