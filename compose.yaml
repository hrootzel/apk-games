# Invoke scripts through Bash: Git/Windows checkouts may not preserve executable bits.
x-image: &image
  image: vector-arcade-local:0.4.4
  build:
    context: .
  working_dir: /workspace
  user: node
  environment:
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    GRADLE_USER_HOME: /workspace/.cache/gradle

services:
  # Interactive services use the live WSL checkout, but dependencies still come
  # from /opt/vector-arcade-deps in the image. No node_modules volume is needed.
  shell:
    <<: *image
    init: true
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
    command: ["bash", "./scripts/shell.sh"]

  dev:
    <<: *image
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
    command: ["bash", "./scripts/dev.sh"]

  # CI/build services intentionally use the source snapshot baked into the
  # image. After source edits, run `docker compose build` before these commands.
  test:
    <<: *image
    init: true
    ipc: host
    volumes:
      - ./out:/workspace/out
    command: ["bash", "./scripts/test.sh"]

  web:
    <<: *image
    volumes:
      - ./out:/workspace/out
    command: ["bash", "./scripts/build-web.sh"]

  apk:
    <<: *image
    init: true
    ipc: host
    volumes:
      - ./out:/workspace/out
      # Gradle's cache is intentionally visible and easy to delete; unlike
      # node_modules it is not hidden in a Docker named volume.
      - ./.cache/gradle:/workspace/.cache/gradle
    command: ["bash", "./scripts/build-apk.sh"]
